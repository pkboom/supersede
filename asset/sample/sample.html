<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample email</title>
<style type="text/css">
  body { margin: 0; padding: 0; background-color: #f4f4f4; }
  .container { width: 600px; }
  @media only screen and (max-width: 600px) {
    .container { width: 100% !important; }
  }
</style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f4">
  <tr>
    <td align="center">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff">
        <tr>
          <td align="center" style="padding: 24px 30px 0 30px;">
            <img src="https://example.com/logo.png" width="160" height="40" alt="Example Company logo" style="display: block; border: 0;">
          </td>
        </tr>
        <tr>
          <td style="padding: 30px 30px 10px 30px; font-family: Arial, Helvetica, sans-serif; font-size: 20px; line-height: 26px; color: #1a1a1a;">
            Your order is on its way
          </td>
        </tr>
        <tr>
          <td align="center" style="padding: 20px 30px 30px 30px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="innertd buttonblock" bgcolor="#1f6feb" style="border-radius: 4px; background-color: #1f6feb;">
                  <a target="_blank" class="buttonstyles" style="font-size: 16px; line-height: 18px; font-family: Arial, Helvetica, sans-serif; color: #FFFFFF; text-align: center; text-decoration: none; display: block; font-weight: bold; padding: 16px 40px; background-color: #1f6feb; border: 0px solid #1f6feb; border-radius: 4px;" href="https://example.com/track-your-order" title="">TRACK YOUR ORDER</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td id="Footer" class="darkmode" valign="top" style="padding: 0 30px 30px 30px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 16px; color: #7C828A;">
            &copy; 2026 Example Company, Inc. All rights reserved.<br>
            123 Example Street <strong>Suite 500</strong> &bull; Springfield, IL 62704<br>
            <a href="https://example.com/unsubscribe" target="_blank" style="font-size: 12px; text-decoration: underline; color: #4470C3;">Unsubscribe</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
